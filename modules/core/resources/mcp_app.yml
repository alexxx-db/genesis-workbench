resources:
  apps:
    mcp_genesis_workbench_app:
      name: ${var.mcp_app_name}
      description: 'MCP server for Genesis Workbench (deployed endpoints; workflows in P1)'
      source_code_path: ../mcp_app

      # SECURITY — two layers (HARDENING_CHECKLIST.md 2.1/2.2):
      #   1. This accessor list decides who can reach the app at all. Pinned to
      #      the deployer (deny-by-default); workspace admins always retain
      #      access (Databricks manages that entry — do NOT add "admins" here).
      #   2. Per-caller authorization inside the server (genesis_workbench
      #      .mcp_authz) decides which capabilities each admitted caller may
      #      run, from the same app_permissions table the UI enforces. Tool
      #      calls run as the app SP, but are denied unless the caller's groups
      #      hold a module_access grant for the capability's module (admin
      #      group bypasses). Mode knob: MCP_AUTHZ_MODE in mcp_app/app.yml.
      #
      # To entitle a specific group: add a CAN_USE entry below (the group must
      # already exist; do NOT use "admins"), redeploy, AND grant the group
      # module access via AppPermissionsManager.grant_module_access (or the
      # Master Settings UI). See app/backend/documentation/mcp_server.md.
      #   - level: CAN_USE
      #     group_name: <your-entitled-group>
      permissions:
        - level: CAN_MANAGE
          user_name: ${var.current_user}

      resources:
        - name: "sql_warehouse"
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: "CAN_USE"
        - name: "core_catalog_name"
          secret:
            key: "core_catalog_name"
            scope: ${var.secret_scope_name}
            permission: "READ"
        - name: "core_schema_name"
          secret:
            key: "core_schema_name"
            scope: ${var.secret_scope_name}
            permission: "READ"
        - name: "dev_user_prefix"
          secret:
            key: "dev_user_prefix"
            scope: ${var.secret_scope_name}
            permission: "READ"
